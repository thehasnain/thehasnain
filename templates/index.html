<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition Attendance System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .camera-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        
        #video {
            width: 100%;
            max-width: 640px;
            height: 480px;
            border-radius: 10px;
            border: 3px solid #667eea;
            background: #f8f9fa;
        }
        
        .btn-custom {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            margin: 10px;
            transition: all 0.3s ease;
        }
        
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: white;
        }
        
        .result-container {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        
        .success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .loading {
            display: none;
            color: #667eea;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102,126,234,.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .nav-link {
            background: rgba(255,255,255,0.2);
            border-radius: 25px;
            padding: 10px 20px;
            color: white !important;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .nav-link:hover {
            background: rgba(255,255,255,0.3);
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-camera"></i> Face Recognition Attendance</h1>
            <p>Position your face in front of the camera for attendance marking</p>
            <a href="/dashboard" class="nav-link">
                <i class="fas fa-chart-dashboard"></i> View Dashboard
            </a>
        </div>

        <div class="camera-container">
            <div class="row">
                <div class="col-12">
                    <h3 class="mb-4">
                        <i class="fas fa-video"></i> Live Camera Feed
                    </h3>
                    
                    <video id="video" autoplay muted playsinline></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    
                    <div class="mt-4">
                        <button id="startCamera" class="btn btn-custom">
                            <i class="fas fa-play"></i> Start Camera
                        </button>
                        
                        <button id="captureBtn" class="btn btn-custom" disabled>
                            <i class="fas fa-camera"></i> Capture & Recognize
                        </button>
                        
                        <button id="stopCamera" class="btn btn-secondary" disabled>
                            <i class="fas fa-stop"></i> Stop Camera
                        </button>
                    </div>
                    
                    <div class="loading mt-3">
                        <div class="spinner"></div>
                        Processing...
                    </div>
                    
                    <div id="result" class="result-container">
                        <h5 id="resultTitle"></h5>
                        <p id="resultMessage"></p>
                        <div id="resultDetails"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="fas fa-users fa-3x text-primary mb-3"></i>
                        <h5>Students Registered</h5>
                        <p class="text-muted">Upload student photos to recognize faces</p>
                        <a href="/dashboard" class="btn btn-outline-primary">Manage Students</a>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center">
                        <i class="fas fa-chart-line fa-3x text-success mb-3"></i>
                        <h5>View Reports</h5>
                        <p class="text-muted">Check attendance reports and export data</p>
                        <a href="/dashboard" class="btn btn-outline-success">View Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let context = canvas.getContext('2d');
        let stream = null;
        
        const startCameraBtn = document.getElementById('startCamera');
        const captureBtn = document.getElementById('captureBtn');
        const stopCameraBtn = document.getElementById('stopCamera');
        const loading = document.querySelector('.loading');
        const result = document.getElementById('result');
        
        // Start camera
        startCameraBtn.addEventListener('click', async () => {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480 } 
                });
                video.srcObject = stream;
                
                startCameraBtn.disabled = true;
                captureBtn.disabled = false;
                stopCameraBtn.disabled = false;
                
                showResult('Camera started successfully!', 'Camera is now active. Click "Capture & Recognize" when ready.', 'success');
                
            } catch (error) {
                console.error('Error accessing camera:', error);
                showResult('Camera Error', 'Unable to access camera. Please check permissions.', 'error');
            }
        });
        
        // Stop camera
        stopCameraBtn.addEventListener('click', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                stream = null;
            }
            
            startCameraBtn.disabled = false;
            captureBtn.disabled = true;
            stopCameraBtn.disabled = true;
            
            hideResult();
        });
        
        // Capture and recognize
        captureBtn.addEventListener('click', async () => {
            if (!stream) {
                showResult('No Camera', 'Please start the camera first.', 'error');
                return;
            }
            
            // Set canvas size to match video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Draw current frame
            context.drawImage(video, 0, 0);
            
            // Convert to base64
            const imageData = canvas.toDataURL('image/jpeg', 0.8);
            
            // Show loading
            loading.style.display = 'block';
            captureBtn.disabled = true;
            
            try {
                const response = await fetch('/recognize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ image: imageData })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const confidence = (data.confidence * 100).toFixed(1);
                    let message = `Student: ${data.name}<br>Confidence: ${confidence}%<br><br>`;
                    
                    if (data.attendance_marked) {
                        message += `✅ ${data.message}`;
                        showResult('Face Recognized!', message, 'success');
                    } else {
                        message += `⚠️ ${data.message}`;
                        showResult('Already Marked', message, 'error');
                    }
                } else {
                    showResult('Recognition Failed', data.message, 'error');
                }
                
            } catch (error) {
                console.error('Error:', error);
                showResult('Server Error', 'Failed to connect to server. Please try again.', 'error');
            }
            
            // Hide loading
            loading.style.display = 'none';
            captureBtn.disabled = false;
        });
        
        function showResult(title, message, type) {
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultMessage').innerHTML = message;
            
            result.className = `result-container ${type}`;
            result.style.display = 'block';
            
            // Auto hide after 5 seconds for success messages
            if (type === 'success') {
                setTimeout(() => {
                    hideResult();
                }, 5000);
            }
        }
        
        function hideResult() {
            result.style.display = 'none';
        }
        
        // Auto-start camera if supported
        window.addEventListener('load', () => {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                // Camera is supported
            } else {
                showResult('Browser Not Supported', 'Your browser does not support camera access.', 'error');
            }
        });
    </script>
</body>
</html>
